name: Robot MT5 demo
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Duree en minutes"
        default: "5"
      categories:
        description: "Categories (Forex,Metals,Crypto,Indices,Stocks)"
        default: "Forex,Metals,Crypto,Indices"
      strategies:
        description: "Strategies (booster,ema)"
        default: "booster,ema"
jobs:
  bot:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer MT5
        shell: pwsh
        run: |
          pip install MetaTrader5
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process .\mt5setup.exe -ArgumentList "/auto" -Wait
          Start-Sleep 90
      - name: Lancer le robot
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MINUTES: ${{ inputs.minutes }}
          CATEGORIES: ${{ inputs.categories }}
          STRATEGIES: ${{ inputs.strategies }}
        run: python bot_mt5.py
      - name: Résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats
          path: out/
