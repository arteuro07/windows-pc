name: Backtest Order Block
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bt:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer MT5
        shell: pwsh
        run: |
          pip install MetaTrader5
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process .\mt5setup.exe -ArgumentList "/auto" -Wait
          Start-Sleep 90
      - name: Backtest
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python backtest_ob.py
      - name: Résultats (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats
          path: out/
      - name: Enregistrer le résumé dans le dépôt
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path res_bt | Out-Null
          if (Test-Path out/ob_summary.txt) { Copy-Item out/ob_summary.txt res_bt/ob_summary.txt -Force }
          if (Test-Path out/ob_backtest.log) { Copy-Item out/ob_backtest.log res_bt/ob_backtest.log -Force }
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add res_bt/ob_summary.txt res_bt/ob_backtest.log
          git commit -m "Resultats backtest Order Block" 2>$null
          git pull --rebase
          git push
