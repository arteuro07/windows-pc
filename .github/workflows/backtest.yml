name: Backtest FVG
on:
  workflow_dispatch:
jobs:
  bt:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer MT5
        shell: pwsh
        run: |
          pip install MetaTrader5
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process .\mt5setup.exe -ArgumentList "/auto" -Wait
          Start-Sleep 90
      - name: Backtest
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python backtest_fvg.py
      - name: Résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats
          path: out/
