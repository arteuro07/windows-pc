name: Backtest Cassure Or historique (sans ordres)
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Date de début (AAAA-MM-JJ)"
        required: true
        default: "2022-01-01"
        type: string
      end:
        description: "Date de fin (AAAA-MM-JJ)"
        required: true
        default: "2026-10-20"
        type: string
      symbol:
        description: "Symbole exact MT5 (ex. XAUUSD, XAUUSDm)"
        required: true
        default: "XAUUSD"
        type: string
      utc_offset:
        description: "Décalage de l'heure serveur par rapport à UTC (à vérifier)"
        required: true
        default: "0"
        type: string
      spread:
        description: "Spread estimé en unités de prix XAUUSD (ex. 0.30)"
        required: true
        default: "0.30"
        type: string
jobs:
  backtest:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer dépendance MT5
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process .\mt5setup.exe -ArgumentList "/auto" -Wait
          Start-Sleep 90
      - name: Exécuter le backtest (aucun ordre envoyé)
        shell: pwsh
        env:
          MT5_LOGIN: \${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: \${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: \${{ secrets.MT5_SERVER }}
          BT_START: \${{ inputs.start }}
          BT_END: \${{ inputs.end }}
          BRK_SYMBOL: \${{ inputs.symbol }}
          BRK_UTC_OFFSET_HOURS: \${{ inputs.utc_offset }}
          BRK_SPREAD: \${{ inputs.spread }}
        run: python backtest_gold_breakout.py
      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-cassure-or
          path: out/
          if-no-files-found: warn
