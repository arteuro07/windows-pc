name: Cassure Or auto
on:
  schedule:
    - cron: "7,22,37,52 3-16 * * 1-5"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: brk-auto
  cancel-in-progress: false
jobs:
  lancer:
    if: ${{ vars.BRK_AUTO == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decider et lancer une session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          M=$(python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          START, END = 6 * 60 + 20, 18 * 60
          now = datetime.now(timezone.utc)
          srv = now.astimezone(ZoneInfo("America/New_York")).replace(tzinfo=None) + timedelta(hours=7)
          m = srv.hour * 60 + srv.minute
          left = END - m
          print(0 if srv.weekday() >= 5 or m < START or left < 20 else min(350, left))
          PY
          )
          echo "minutes proposees : $M"
          if [ "$M" -le 0 ]; then echo "rien a lancer"; exit 0; fi
          ACTIVE=$(gh run list --workflow mt5.yml --limit 10 --json status -q '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          echo "sessions deja actives : $ACTIVE"
          if [ "$ACTIVE" -gt 0 ]; then exit 0; fi
          gh workflow run mt5.yml --ref main -f minutes=$M
          echo "session lancee : $M min"
